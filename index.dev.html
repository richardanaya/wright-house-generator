<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prairie Houses</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside id="hud">
      <p class="eyebrow">Shape grammar</p>
      <h1>Prairie Houses</h1>
      <p id="subtitle" class="subtitle">A hearth, then wings.</p>
      <canvas id="plan" width="220" height="140" aria-hidden="true"></canvas>
      <div class="seed-row">
        <label for="seed">Seed</label>
        <input id="seed" type="number" min="1" max="999999999" inputmode="numeric" />
        <button id="regenerate" type="button">Regenerate</button>
      </div>
      <div class="styles" role="radiogroup" aria-label="Style">
        <button type="button" data-style="prairie" aria-pressed="true">Prairie</button>
        <button type="button" data-style="usonian" aria-pressed="false">Usonian</button>
        <button type="button" data-style="mixed" aria-pressed="false">Mixed</button>
      </div>
      <label class="slider">
        <span>Size <output id="size-value">1.00</output></span>
        <input id="size" type="range" min="0.75" max="1.45" step="0.05" value="1" />
      </label>
      <label class="slider">
        <span>Wings <output id="wings-value">4</output></span>
        <input id="wings" type="range" min="2" max="4" step="1" value="4" />
      </label>
      <label class="slider">
        <span>Overhang <output id="overhang-value">5.0</output></span>
        <input id="overhang" type="range" min="2" max="8" step="0.5" value="5" />
      </label>
      <p id="readout" class="readout">Prairie</p>
      <p class="hint">Drag to orbit. Scroll to zoom. R for a new seed.</p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
